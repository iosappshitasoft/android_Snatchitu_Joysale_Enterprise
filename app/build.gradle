apply plugin: 'com.android.application'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
apply plugin: 'kotlin-android'

android {
    signingConfigs {
        customDebug {

        storeFile file('keystore.pks')
            storePassword '4Jb8KZma7d'
            keyAlias 'snatchitup'
            keyPassword 'z3QAde24jp'
        }
        release {
            storeFile file('keystore.pks')
            storeType 'pkcs12'
            storePassword '4Jb8KZma7d'
            keyAlias 'snatchitup'
            keyPassword '4Jb8KZma7d'
        }
    }
    compileSdkVersion 36
    buildToolsVersion "30.0.3"
    defaultConfig {
        applicationId "com.ni.SnatchItUp"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 13
        versionName "1.10"
        multiDexEnabled true
        archivesBaseName = "Snatchitup"
    }

    buildTypes {
        debug {
            // Use default Android debug keystore (avoids custom keystore issues)
        }
        release {
            signingConfig signingConfigs.release
        }
    }
    dexOptions {
        javaMaxHeapSize "4g"
    }


    //addons smart reply
    aaptOptions {
        noCompress "tflite"
    }

    sourceSets {
        main {
            res.srcDirs = ['src/main/res', 'src/main/res-buynow', 'src/main/res-addons']
            java {
                //Addon - Delete the lines for necessary Addons
                filter.excludes = ["**/addons/mapbox"]
            }
        }
    }

    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
            excludes += ['**/libimage_processing_util_jni.so']
        }
    }
    namespace 'com.ni.SnatchItUp'
}

